<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Campus Bite - Campus Food Delivery</title>
    <meta name="description" content="Campus Bite: Premier campus food ordering and delivery platform connecting students with verified campus kitchens." />
    <meta property="og:title" content="Campus Bite - Campus Food Delivery" />
    <meta property="og:description" content="Order fresh campus meals delivered directly to your hostel or lecture block." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Preconnect & DNS-Prefetch for Fast Image Loading -->
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
    <link rel="dns-prefetch" href="https://images.unsplash.com" />

    <style>
      /* Zero-latency initial shell style */
      #initial-loader {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #f8fafc;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: #0f172a;
      }
      .brand-spinner {
        width: 48px;
        height: 48px;
        border-radius: 14px;
        background: #fef3c7;
        border: 2px solid #f59e0b;
        display: flex;
        align-items: center;
        justify-content: center;
        animation: pulse 1.5s infinite ease-in-out;
      }
      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(0.96); opacity: 0.8; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="initial-loader">
        <div class="brand-spinner">
          <span style="font-size: 22px;">🍔</span>
        </div>
        <p style="margin-top: 14px; font-weight: 600; font-size: 14px; color: #1e293b; letter-spacing: -0.01em;">CampusBites</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
